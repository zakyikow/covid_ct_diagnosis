[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "covid_ct_diagnosis"
version = "0.1.0"
description = "COVID-19 diagnosis from chest CT, evaluated honestly: patient-level splits and a new-hospital test"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "timm>=1.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "pillow>=10.0",
    "pydicom>=2.4",
    # Not imported directly: plugins that let pydicom read the JPEG-compressed Tehran scans
    "pylibjpeg>=2.0",
    "pylibjpeg-libjpeg>=2.1",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]
data = [
    "kaggle>=1.7",
    # Needed by the kaggle tool, which forgets to list it
    "six",
]
notebook = ["jupyterlab>=4.0", "ipywidgets>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 115
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
